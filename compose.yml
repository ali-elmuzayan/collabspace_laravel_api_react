services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - client_dist:/usr/share/nginx/html:ro
    depends_on:
      client:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  client:
    build: ./client
    volumes:
      - client_dist:/output
    restart: "no"

  backend:
    build: ./backend
    image: pm-backend:latest
    container_name: backend
    env_file: ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-project_management}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  queue:
    image: pm-backend:latest
    env_file: ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-project_management}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - backend
      - redis
      - db
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    restart: unless-stopped

  scheduler:
    image: pm-backend:latest
    env_file: ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-project_management}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - backend
      - db
    command: php artisan schedule:work
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_management}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
  client_dist:
